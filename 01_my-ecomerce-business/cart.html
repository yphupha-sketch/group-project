 <!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตะกร้าสินค้า - Natural Bliss</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">Natural Bliss</a>
    <nav>
      <a href="index.html">สินค้า</a>
      <a href="cart.html" class="active cart-icon">🛒 ตะกร้า <span class="cart-badge" id="cartBadge" style="display:none">0</span></a>
      <span id="userDisplay"><a href="login.html">เข้าสู่ระบบ</a></span>
    </nav>
  </nav>

  <div class="container">
    <h1 class="page-title">ตะกร้าสินค้า</h1>

    <div id="emptyCart" class="hidden" style="text-align:center;padding:3rem">
      <p style="font-size:1.2rem;color:var(--text-light)">🛒 ตะกร้าของคุณว่างเปล่า</p>
      <a href="index.html" class="btn btn-primary" style="margin-top:1rem">เลือกซื้อสินค้า</a>
    </div>

    <div class="cart-page" id="cartPage">
      <div class="cart-items" id="cartItemsContainer"></div>
      <div class="cart-summary" id="cartSummary"></div>
    </div>

    <div id="checkoutSection" class="hidden">
      <h2 class="page-title" style="margin-top:2rem">ข้อมูลจัดส่ง</h2>
      <div class="checkout-section">
        <div class="form-group">
          <label>ชื่อผู้รับ</label>
          <input type="text" id="checkoutName" placeholder="ชื่อ-นามสกุล">
        </div>
        <div class="form-group">
          <label>ที่อยู่จัดส่ง</label>
          <textarea id="checkoutAddress" rows="3" placeholder="ที่อยู่"></textarea>
        </div>
        <div class="form-group">
          <label>เบอร์โทรศัพท์</label>
          <input type="tel" id="checkoutPhone" placeholder="08X-XXXXXXX">
        </div>
      </div>

      <h2 class="page-title">วิธีการชำระเงิน</h2>
      <div class="checkout-section">
        <label class="payment-option">
          <input type="radio" name="payment" value="โอนเงินผ่านธนาคาร" checked>
          โอนเงินผ่านธนาคาร
        </label>
        <label class="payment-option">
          <input type="radio" name="payment" value="บัตรเครดิต/เดบิต">
          บัตรเครดิต/เดบิต
        </label>
        <label class="payment-option">
          <input type="radio" name="payment" value="TrueMoney Wallet">
          TrueMoney Wallet
        </label>
        <label class="payment-option">
          <input type="radio" name="payment" value="พร้อมเพย์">
          พร้อมเพย์
        </label>
        <label class="payment-option">
          <input type="radio" name="payment" value="เก็บเงินปลายทาง">
          เก็บเงินปลายทาง
        </label>
      </div>

      <button class="btn btn-success btn-block" style="max-width:300px;margin:0 auto 2rem;display:block" onclick="placeOrder()">
        ยืนยันคำสั่งซื้อ
      </button>
    </div>
  </div>

  <footer>&copy; 2026 Natural Bliss Soap. All rights reserved.</footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.location.hash === '#checkout') {
        document.getElementById('checkoutSection').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
