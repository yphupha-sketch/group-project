<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - Natural Bliss</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">Natural Bliss</a>
    <nav>
      <a href="index.html">สินค้า</a>
      <a href="cart.html" class="cart-icon">🛒 ตะกร้า <span class="cart-badge" id="cartBadge" style="display:none">0</span></a>
      <span id="userDisplay"><a href="login.html">เข้าสู่ระบบ</a></span>
    </nav>
  </nav>

  <div class="container">
    <div class="auth-container">
      <h2>สมัครสมาชิก</h2>
      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label>ชื่อผู้ใช้</label>
          <input type="text" id="signupUsername" placeholder="กรุณากรอกชื่อผู้ใช้" required>
        </div>
        <div class="form-group">
          <label>ชื่อ-นามสกุล</label>
          <input type="text" id="signupName" placeholder="กรุณากรอกชื่อ-นามสกุล" required>
        </div>
        <div class="form-group">
          <label>รหัสผ่าน</label>
          <input type="password" id="signupPassword" placeholder="กรุณากรอกรหัสผ่าน" required>
        </div>
        <div class="form-group">
          <label>ยืนยันรหัสผ่าน</label>
          <input type="password" id="signupConfirm" placeholder="กรุณากรอกรหัสผ่านอีกครั้ง" required>
        </div>
        <div class="form-group">
          <label>ที่อยู่จัดส่ง</label>
          <textarea id="signupAddress" rows="3" placeholder="กรุณากรอกที่อยู่สำหรับจัดส่งสินค้า" required></textarea>
        </div>
        <div class="form-group">
          <label>เบอร์โทรศัพท์</label>
          <input type="tel" id="signupPhone" placeholder="08X-XXXXXXX" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">สมัครสมาชิก</button>
      </form>
      <div class="auth-link">
        มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 Natural Bliss Soap. All rights reserved.</footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function handleSignup(e) {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value.trim();
      const name = document.getElementById('signupName').value.trim();
      const password = document.getElementById('signupPassword').value.trim();
      const confirm = document.getElementById('signupConfirm').value.trim();
      const address = document.getElementById('signupAddress').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();

      if (!username || !name || !password || !confirm || !address || !phone) {
        showToast('กรุณากรอกข้อมูลให้ครบทุกช่อง');
        return;
      }
      if (password !== confirm) { showToast('รหัสผ่านไม่ตรงกัน'); return; }
      if (password.length < 4) { showToast('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'); return; }

      const existingUsers = JSON.parse(localStorage.getItem('soapShopUsers') || '[]');
      if (existingUsers.find(u => u.username === username)) {
        showToast('ชื่อผู้ใช้นี้มีอยู่แล้ว');
        return;
      }

      existingUsers.push({ username, name, password, address, phone });
      localStorage.setItem('soapShopUsers', JSON.stringify(existingUsers));

      currentUser = { name, username, address, phone };
      localStorage.setItem('soapShopUser', JSON.stringify(currentUser));
      showToast('สมัครสมาชิกสำเร็จ');
      setTimeout(() => window.location.href = 'index.html', 500);
    }
  </script>
</body>
</html>
