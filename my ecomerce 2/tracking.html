<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking - Soap Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">SOAP STORE ✦</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html" class="cart-icon">🛒 <span class="cart-badge" id="cartBadge" style="display:none">0</span></a>
    </nav>
  </nav>

  <div class="container" id="trackingContent">
    <h1 class="page-title">Order Tracking</h1>
    <p class="page-subtitle">Track your order status</p>

    <div class="tracking-card">
      <h3>Order Information</h3>
      <div class="tracking-info">
        <div><span class="label">Order ID:</span> <span class="value" id="orderId"></span></div>
        <div><span class="label">Date:</span> <span class="value" id="orderDate"></span></div>
        <div><span class="label">Customer:</span> <span class="value" id="orderCustomer"></span></div>
        <div><span class="label">Phone:</span> <span class="value" id="orderPhone"></span></div>
        <div><span class="label">Address:</span> <span class="value" id="orderAddress"></span></div>
        <div><span class="label">Payment:</span> <span class="value" id="orderPayment"></span></div>
        <div><span class="label">Total:</span> <span class="value" id="orderTotal"></span></div>
      </div>
    </div>

    <div class="tracking-card">
      <h3>Items</h3>
      <div class="track-items" id="orderItems"></div>
    </div>

    <div class="tracking-card">
      <h3>Tracking Timeline</h3>
      <div class="timeline" id="trackingTimeline"></div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div>&copy; 2026 Soap Store. All rights reserved.</div>
      <div class="footer-social">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">Line</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
