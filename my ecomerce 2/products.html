<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Soap Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">SOAP STORE ✦</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="login.html" id="userDisplay">Login / Register</a>
      <a href="cart.html" class="cart-icon">🛒 <span class="cart-badge" id="cartBadge" style="display:none">0</span></a>
    </nav>
  </nav>

  <div class="container">
    <h1 class="page-title">Products</h1>
    <p class="page-subtitle">Browse our collection of handcrafted soaps</p>

    <div class="products-layout">
      <aside class="filter-sidebar">
        <div class="filter-section">
          <h4>Category</h4>
          <div id="filterCategory"></div>
        </div>
        <div class="filter-section">
          <h4>Price Range</h4>
          <div class="price-range">
            <input type="number" id="priceMin" placeholder="Min" onchange="applyFilters()">
            <span>—</span>
            <input type="number" id="priceMax" placeholder="Max" onchange="applyFilters()">
          </div>
        </div>
        <div class="filter-section">
          <h4>Scent</h4>
          <div id="filterScent"></div>
        </div>
        <div class="filter-section">
          <h4>Formula</h4>
          <div id="filterFormula"></div>
        </div>
        <div class="filter-section">
          <h4>Size</h4>
          <div id="filterSize"></div>
        </div>
        <button class="btn btn-outline btn-block" onclick="resetFilters()">Reset Filters</button>
      </aside>

      <div class="products-content">
        <div class="product-grid" id="productGrid"></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div>&copy; 2026 Soap Store. All rights reserved.</div>
      <div class="footer-social">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">Line</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function resetFilters() {
      document.querySelectorAll('#filterCategory input, #filterScent input, #filterFormula input, #filterSize input').forEach(el => el.checked = false);
      document.getElementById('priceMin').value = '';
      document.getElementById('priceMax').value = '';
      applyFilters();
    }
  </script>
</body>
</html>
