<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - Soap Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">SOAP STORE ✦</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html" class="cart-icon">🛒 <span class="cart-badge" id="cartBadge" style="display:none">0</span></a>
    </nav>
  </nav>

  <div class="container">
    <div class="auth-container" id="loginSection">
      <h2>Login</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>
        <div class="forgot-link"><a href="#">Forgot password?</a></div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <div class="auth-link">
        Don't have an account? <a href="#" onclick="showRegister()">Register</a>
      </div>
    </div>

    <div class="auth-container hidden" id="registerSection">
      <h2>Register</h2>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="regName" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Enter your password" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="regConfirm" placeholder="Confirm your password" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="regPhone" placeholder="08X-XXXXXXX" required>
        </div>
        <div class="form-group">
          <label>Address</label>
          <textarea id="regAddress" rows="2" placeholder="Enter your address" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>
      <div class="auth-link">
        Already have an account? <a href="#" onclick="showLogin()">Login</a>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div>&copy; 2026 Soap Store. All rights reserved.</div>
      <div class="footer-social">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">Line</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function showRegister() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('registerSection').classList.remove('hidden');
    }
    function showLogin() {
      document.getElementById('registerSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (!email || !password) { showToast('Please fill in all fields'); return; }

      const users = JSON.parse(localStorage.getItem('soapShopUsers') || '[]');
      const user = users.find(u => u.email === email && u.password === password);
      if (user) {
        currentUser = { name: user.name, email: user.email, phone: user.phone, address: user.address };
        localStorage.setItem('soapShopUser', JSON.stringify(currentUser));
        showToast('Login successful');
        const params = new URLSearchParams(window.location.search);
        setTimeout(() => window.location.href = params.get('redirect') || 'index.html', 500);
      } else {
        showToast('Invalid email or password');
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const confirm = document.getElementById('regConfirm').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const address = document.getElementById('regAddress').value.trim();

      if (!name || !email || !password || !confirm || !phone || !address) {
        showToast('Please fill in all fields');
        return;
      }
      if (password !== confirm) { showToast('Passwords do not match'); return; }
      if (password.length < 4) { showToast('Password must be at least 4 characters'); return; }

      const users = JSON.parse(localStorage.getItem('soapShopUsers') || '[]');
      if (users.find(u => u.email === email)) {
        showToast('Email already registered');
        return;
      }

      users.push({ name, email, password, phone, address });
      localStorage.setItem('soapShopUsers', JSON.stringify(users));

      currentUser = { name, email, phone, address };
      localStorage.setItem('soapShopUser', JSON.stringify(currentUser));
      showToast('Registration successful');
      setTimeout(() => window.location.href = 'index.html', 500);
    }
  </script>
</body>
</html>
