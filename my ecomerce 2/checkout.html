<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Soap Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">SOAP STORE ✦</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
      <a href="login.html" id="userDisplay">Login / Register</a>
    </nav>
  </nav>

  <div class="container">
    <h1 class="page-title">Checkout</h1>
    <p class="page-subtitle">Complete your order</p>

    <div class="checkout-layout">
      <div class="checkout-left">
        <div class="checkout-section">
          <h3>Customer Information</h3>
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="checkoutName" placeholder="Full name">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="checkoutPhone" placeholder="08X-XXXXXXX">
          </div>
          <div class="form-group">
            <label>Address</label>
            <textarea id="checkoutAddress" rows="3" placeholder="Shipping address"></textarea>
          </div>
        </div>

        <div class="checkout-section">
          <h3>Payment Method</h3>
          <label class="payment-option">
            <input type="radio" name="payment" value="Bank Transfer" checked>
            Bank Transfer
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="Credit/Debit Card">
            Credit/Debit Card
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="PromptPay">
            PromptPay
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="Cash on Delivery">
            Cash on Delivery
          </label>
        </div>
      </div>

      <div class="checkout-right">
        <div class="cart-summary" id="checkoutSummary">
          <h3>Order Summary</h3>
          <div id="checkoutItems"></div>
          <div class="summary-row"><span>Subtotal</span><span id="checkoutSubtotal">฿0</span></div>
          <div class="summary-row"><span>Shipping</span><span id="checkoutShipping">฿40</span></div>
          <div class="summary-row total"><span>Total</span><span id="checkoutTotal">฿0</span></div>
          <button class="btn btn-primary btn-block" onclick="placeOrder()">Place Order</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div>&copy; 2026 Soap Store. All rights reserved.</div>
      <div class="footer-social">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">Line</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      function renderCheckoutSummary() {
        const itemsContainer = document.getElementById('checkoutItems');
        if (!itemsContainer) return;
        if (cart.length === 0) {
          itemsContainer.innerHTML = '<p style="color:var(--text-light)">Cart is empty</p>';
          return;
        }
        itemsContainer.innerHTML = cart.map(item => `
          <div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:0.4rem 0;border-bottom:1px solid var(--cream-dark)">
            <span>${item.productName} x${item.quantity}</span>
            <span>฿${(item.price * item.quantity).toLocaleString()}</span>
          </div>
        `).join('');

        const subtotal = getCartTotal();
        const shipping = subtotal >= 500 ? 0 : 40;
        const total = subtotal + shipping;
        document.getElementById('checkoutSubtotal').textContent = '฿' + subtotal.toLocaleString();
        document.getElementById('checkoutShipping').textContent = shipping === 0 ? 'FREE' : '฿' + shipping;
        document.getElementById('checkoutTotal').textContent = '฿' + total.toLocaleString();
      }
      renderCheckoutSummary();
    });
  </script>
</body>
</html>
