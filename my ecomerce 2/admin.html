<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Soap Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">SOAP STORE (Admin)</a>
    <nav>
      <a href="index.html">Store</a>
      <span id="userDisplay"><a href="login.html">Login</a></span>
    </nav>
  </nav>

  <div class="container">
    <h1 class="page-title">Admin Dashboard</h1>
    <p class="page-subtitle">Manage your store</p>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="admin-layout">
      <div class="admin-sidebar">
        <button class="active" onclick="showTab('orders')">Orders</button>
        <button onclick="showTab('products')">Products</button>
        <button onclick="showTab('categories')">Categories</button>
        <button onclick="showTab('promotions')">Promotions</button>
        <button onclick="showTab('reports')">Reports</button>
      </div>
      <div class="admin-content" id="adminContent"></div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div>&copy; 2026 Soap Store Admin. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function showTab(tab) {
      document.querySelectorAll('.admin-sidebar button').forEach(b => b.classList.remove('active'));
      document.querySelector(`.admin-sidebar button[onclick*="'${tab}'"]`).classList.add('active');

      if (tab === 'orders') renderAdminOrders();
      else if (tab === 'products') renderAdminProducts();
      else if (tab === 'categories') renderAdminCategories();
      else if (tab === 'promotions') {
        document.getElementById('adminContent').innerHTML = '<div style="background:var(--white);border:1px solid var(--border);border-radius:16px;padding:2rem;text-align:center;color:var(--text-light)"><p>Promotions management coming soon.</p></div>';
      } else if (tab === 'reports') {
        const totalRevenue = orders.filter(o => o.status !== 'cancelled').reduce((s, o) => s + o.total, 0);
        document.getElementById('adminContent').innerHTML = `
          <div style="background:var(--white);border:1px solid var(--border);border-radius:16px;padding:1.5rem">
            <h3 style="font-family:'Playfair Display',serif;margin-bottom:1rem;font-size:1.15rem;font-weight:700;color:var(--dark)">Sales Report</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
              <div style="padding:1.25rem;background:var(--cream);border-radius:10px;text-align:center">
                <div style="font-size:1.6rem;font-weight:700;color:var(--gold-dark);font-family:'Playfair Display',serif">฿${totalRevenue.toLocaleString()}</div>
                <div style="font-size:0.8rem;color:var(--text-light)">Total Revenue</div>
              </div>
              <div style="padding:1.25rem;background:var(--cream);border-radius:10px;text-align:center">
                <div style="font-size:1.6rem;font-weight:700;color:var(--gold-dark);font-family:'Playfair Display',serif">${orders.length}</div>
                <div style="font-size:0.8rem;color:var(--text-light)">Total Orders</div>
              </div>
              <div style="padding:1.25rem;background:var(--cream);border-radius:10px;text-align:center">
                <div style="font-size:1.6rem;font-weight:700;color:var(--gold-dark);font-family:'Playfair Display',serif">฿${(orders.length > 0 ? Math.round(totalRevenue / orders.length) : 0).toLocaleString()}</div>
                <div style="font-size:0.8rem;color:var(--text-light)">Avg Order Value</div>
              </div>
              <div style="padding:1.25rem;background:var(--cream);border-radius:10px;text-align:center">
                <div style="font-size:1.6rem;font-weight:700;color:var(--gold-dark);font-family:'Playfair Display',serif">${products.length}</div>
                <div style="font-size:0.8rem;color:var(--text-light)">Products</div>
              </div>
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
