<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Soap Store</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .user-layout { display: flex; gap: 2rem; }
    .user-sidebar { width: 220px; flex-shrink: 0; }
    .user-sidebar button {
      width: 100%; text-align: left;
      padding: 0.75rem 1.25rem;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      transition: all 0.3s;
      font-weight: 500;
      font-family: 'Sarabun', sans-serif;
      color: var(--text);
    }
    .user-sidebar button:hover { border-color: var(--gold); color: var(--gold); }
    .user-sidebar button.active { background: var(--dark); color: var(--gold); border-color: var(--dark); }
    .user-content { flex: 1; }
    .profile-field {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--cream-dark);
    }
    .profile-field label { min-width: 120px; font-size: 0.85rem; color: var(--text-light); font-weight: 500; }
    .profile-field input, .profile-field textarea {
      flex: 1;
      padding: 0.55rem 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'Sarabun', sans-serif;
      background: var(--cream);
      color: var(--text);
      transition: all 0.3s;
    }
    .profile-field input:focus, .profile-field textarea:focus {
      outline: none;
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
    }
    .profile-field textarea { resize: vertical; min-height: 60px; }
    .profile-actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">SOAP STORE ✦</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html" class="cart-icon">🛒 <span class="cart-badge" id="cartBadge" style="display:none">0</span></a>
      <span id="userDisplay"><a href="login.html">Login / Register</a></span>
    </nav>
  </nav>

  <div class="container">
    <h1 class="page-title">My Account</h1>
    <p class="page-subtitle" id="userGreeting">Welcome back!</p>

    <div id="notLoggedIn" style="text-align:center;padding:3rem">
      <p style="font-size:1.1rem;color:var(--text-light)">Please log in to access your account.</p>
      <a href="login.html" class="btn btn-primary" style="margin-top:1rem">Login</a>
    </div>

    <div id="userAccount" class="hidden">
      <div class="user-layout">
        <div class="user-sidebar">
          <button class="active" onclick="showUserTab('profile')">My Profile</button>
          <button onclick="showUserTab('pending')">Orders Awaiting Payment</button>
          <button onclick="showUserTab('history')">Order History</button>
        </div>
        <div class="user-content" id="userContent"></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div>&copy; 2026 Soap Store. All rights reserved.</div>
      <div class="footer-social">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">Line</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderProfile() {
      const content = document.getElementById('userContent');
      const user = currentUser;
      if (!user) { content.innerHTML = '<p>Not logged in.</p>'; return; }
      content.innerHTML = `
        <div style="background:var(--white);border:1px solid var(--border);border-radius:16px;padding:1.75rem">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;margin-bottom:1.25rem;color:var(--dark)">Modify Account Information</h3>
          <div class="profile-field">
            <label>Name</label>
            <input type="text" id="profName" value="${user.name || ''}">
          </div>
          <div class="profile-field">
            <label>Email</label>
            <input type="email" id="profEmail" value="${user.email || ''}">
          </div>
          <div class="profile-field">
            <label>Phone</label>
            <input type="tel" id="profPhone" value="${user.phone || ''}">
          </div>
          <div class="profile-field">
            <label>Address</label>
            <textarea id="profAddress" rows="2">${user.address || ''}</textarea>
          </div>
          <div class="profile-field">
            <label>New Password</label>
            <input type="password" id="profPassword" placeholder="Leave blank to keep current">
          </div>
          <div class="profile-actions">
            <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
          </div>
        </div>
      `;
    }

    function saveProfile() {
      const name = document.getElementById('profName').value.trim();
      const email = document.getElementById('profEmail').value.trim();
      const phone = document.getElementById('profPhone').value.trim();
      const address = document.getElementById('profAddress').value.trim();
      const password = document.getElementById('profPassword').value.trim();

      if (!name || !email || !phone || !address) { showToast('Please fill in all fields'); return; }

      const users = JSON.parse(localStorage.getItem('soapShopUsers') || '[]');
      const idx = users.findIndex(u => u.email === currentUser.email);
      if (idx !== -1) {
        users[idx].name = name;
        users[idx].email = email;
        users[idx].phone = phone;
        users[idx].address = address;
        if (password) users[idx].password = password;
        localStorage.setItem('soapShopUsers', JSON.stringify(users));
      } else {
        users.push({ name, email, phone, address, password: password || 'default' });
        localStorage.setItem('soapShopUsers', JSON.stringify(users));
      }

      currentUser = { name, email, phone, address };
      localStorage.setItem('soapShopUser', JSON.stringify(currentUser));
      document.getElementById('userGreeting').textContent = 'Welcome back, ' + name + '!';
      showToast('Profile updated successfully');
      renderProfile();
    }

    function renderPendingOrders() {
      const content = document.getElementById('userContent');
      const userOrders = orders.filter(o => o.customerEmail === currentUser.email && o.status === 'pending');
      if (userOrders.length === 0) {
        content.innerHTML = '<div style="background:var(--white);border:1px solid var(--border);border-radius:16px;padding:2rem;text-align:center;color:var(--text-light)"><p>No orders awaiting payment.</p></div>';
        return;
      }
      content.innerHTML = `
        <h3 style="font-family:\'Playfair Display\',serif;font-size:1.15rem;font-weight:700;margin-bottom:1rem;color:var(--dark)">Orders Awaiting Payment</h3>
        ${userOrders.map(o => `
          <div class="tracking-card" style="cursor:pointer" onclick="location.href=\'tracking.html?id=${o.id}\'">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
              <strong>${o.id}</strong>
              <span class="status-badge status-pending">Awaiting Payment</span>
            </div>
            <div style="font-size:0.85rem;color:var(--text-light)">${o.createdAt} — ${o.items.length} item(s) — <strong style="color:var(--gold-dark)">฿${o.total.toLocaleString()}</strong></div>
            <div style="font-size:0.8rem;color:var(--text-light);margin-top:0.25rem">Payment: ${o.paymentMethod}</div>
          </div>
        `).join('')}
      `;
    }

    function renderOrderHistory() {
      const content = document.getElementById('userContent');
      const userOrders = orders.filter(o => o.customerEmail === currentUser.email);
      if (userOrders.length === 0) {
        content.innerHTML = '<div style="background:var(--white);border:1px solid var(--border);border-radius:16px;padding:2rem;text-align:center;color:var(--text-light)"><p>No order history.</p></div>';
        return;
      }
      content.innerHTML = `
        <h3 style="font-family:\'Playfair Display\',serif;font-size:1.15rem;font-weight:700;margin-bottom:1rem;color:var(--dark)">Order History</h3>
        <table class="admin-table">
          <thead><tr><th>Order ID</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead>
          <tbody>
            ${userOrders.map(o => `
              <tr style="cursor:pointer" onclick="location.href=\'tracking.html?id=${o.id}\'">
                <td><strong>${o.id}</strong></td>
                <td>${o.createdAt}</td>
                <td>${o.items.map(i => `${i.productName} x${i.quantity}`).join('<br>')}</td>
                <td>฿${o.total.toLocaleString()}</td>
                <td>${o.paymentMethod}</td>
                <td><span class="status-badge status-${o.status}">${o.status}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function showUserTab(tab) {
      document.querySelectorAll('.user-sidebar button').forEach(b => b.classList.remove('active'));
      document.querySelector(`.user-sidebar button[onclick*="'${tab}'"]`).classList.add('active');
      if (tab === 'profile') renderProfile();
      else if (tab === 'pending') renderPendingOrders();
      else if (tab === 'history') renderOrderHistory();
    }

    document.addEventListener('DOMContentLoaded', function () {
      if (currentUser) {
        document.getElementById('notLoggedIn').classList.add('hidden');
        document.getElementById('userAccount').classList.remove('hidden');
        document.getElementById('userGreeting').textContent = 'Welcome back, ' + currentUser.name + '!';
        renderProfile();
      }
    });
  </script>
</body>
</html>
